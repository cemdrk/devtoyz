name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents:write is needed so the job can commit package-lock.json back
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Decide which install path to use before setup-node,
      # so caching can be toggled to match.
      - name: Detect lock file
        id: detect
        run: |
          if [ -f package-lock.json ]; then
            echo "has_lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lock=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # npm cache keys off the lock file — only enable it when one exists
          cache: ${{ steps.detect.outputs.has_lock == 'true' && 'npm' || '' }}

      - name: Install (ci)
        if: steps.detect.outputs.has_lock == 'true'
        run: npm ci

      - name: Install (fresh) and commit lock file
        if: steps.detect.outputs.has_lock == 'false'
        run: |
          npm install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          # [skip ci] stops this commit from triggering a redundant run
          git commit -m "chore: add package-lock.json [skip ci]"
          git push

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
